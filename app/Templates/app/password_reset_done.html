<!DOCTYPE html>
{% load static %}
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Liên kết đã gửi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat"
      style="background-image: url('{% static 'app/images/fansipan.jpg' %}');">

  <!-- Overlay làm dịu nền -->
  <div class="absolute inset-0 bg-black/30"></div>

  <!-- Khung thông báo -->
  <div class="relative w-full max-w-md p-8
              rounded-2xl shadow-2xl
              border border-white/40
              backdrop-blur-xl
              bg-white/20">

    <h2 class="text-2xl font-bold text-center mb-6 text-white drop-shadow">
      Liên kết đã gửi
    </h2>

    <p class="text-center text-sm mb-4 text-white">
      Chúng tôi đã gửi liên kết đặt lại mật khẩu đến địa chỉ email của bạn.
      Vui lòng kiểm tra email và làm theo hướng dẫn.
    </p>

    <p class="text-center text-sm text-white">
      Nếu bạn không nhận được email, hãy kiểm tra thư mục spam hoặc
      <a href="{% url 'password_reset' %}" class="font-semibold underline">
        thử lại
      </a>.
    </p>

    <div class="mt-6 text-center">
      <a href="{% url 'login' %}"
         class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition">
        Quay lại đăng nhập
      </a>
    </div>
  </div>

</body>
</html>
