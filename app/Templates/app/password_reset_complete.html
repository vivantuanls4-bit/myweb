<!DOCTYPE html>
{% load static %}
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Mật khẩu đã được đặt lại</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat"
      style="background-image: url('{% static 'app/images/fansipan.jpg' %}');">

  <!-- Overlay làm dịu nền -->
  <div class="absolute inset-0 bg-black/30"></div>

  <!-- Khung thông báo -->
  <div class="relative w-full max-w-md p-8
              rounded-2xl shadow-2xl
              border border-white/40
              backdrop-blur-xl
              bg-white/20">

    <h2 class="text-2xl font-bold text-center mb-6 text-white drop-shadow">
      Mật khẩu đã được đặt lại
    </h2>

    <p class="text-center text-sm mb-4 text-white">
      Mật khẩu của bạn đã được đặt lại thành công.
      Bây giờ bạn có thể đăng nhập với mật khẩu mới.
    </p>

    <div class="text-center">
      <a href="{% url 'login' %}"
         class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition">
        Đăng nhập
      </a>
    </div>
  </div>

</body>
</html>
